[hackernews]
base_url = https://news.ycombinator.com

[ui]
initial_tab = new
; Themes: default, nord, catppuccin (mocha), catppuccin-mocha,
; catppuccin-latte, catppuccin-frappe, catppuccin-macchiato.
; Add themes/<name>.ini to make another theme available without C changes.
; theme = default
; Optional overrides take priority over the theme, regardless of key order.
; Colors: default, black, red, green, yellow, blue, magenta, cyan, white,
; palette indexes 0-255, or unquoted #RRGGBB (for example #CDD6F4).
; Hex colors use RGB on mutable palettes; fixed palettes use nearest colors.
; foreground = default
; background = default
