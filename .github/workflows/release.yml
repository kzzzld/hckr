name: Test and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libncurses-dev libcurl4-openssl-dev libxml2-dev pkg-config
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew bundle
      - name: Build and test
        run: make test

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Package tagged sources
        run: python3 scripts/package_release.py "$GITHUB_REF_NAME"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="hckr-${GITHUB_REF_NAME#v}.tar.gz"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release download "$GITHUB_REF_NAME" --pattern "$archive" --pattern SHA256SUMS --dir existing
            cmp "dist/$archive" "existing/$archive"
            cmp dist/SHA256SUMS existing/SHA256SUMS
          else
            gh release create "$GITHUB_REF_NAME" "dist/$archive" dist/SHA256SUMS \
              --verify-tag --title "hckr $GITHUB_REF_NAME" --generate-notes --latest
          fi
